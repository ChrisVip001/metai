[package]
name = "metai"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu"]
cpu = ["burn/flex"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
rocm = ["burn/rocm"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cubecl-cpu = ["burn/cpu"]

[dependencies]
burn = { version = "0.22.1", features = ["dataset"] }

# 数据处理
tokenizers = "0.23.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# 实用工具
rand = "0.10"
tempfile = "3"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"          # 兼顾性能与编译速度的最佳选择
codegen-units = 16    # 允许并行编译，显著提升速度
panic = 'abort'
strip = "symbols"     # 剥离符号表，显著减少二进制体积（约 50%-80%）
debug = false

[profile.dev]
opt-level = 0
debug = 1             # 减少调试信息深度
incremental = true    # 确保开启增量编译
